plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tetz.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tetz.agent'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/../master/tetz-release.keystore")
            storePassword 'tetz123456'
            keyAlias 'tetz'
            keyPassword 'tetz123456'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

tasks.register('copyApk', Copy) {
    dependsOn 'assembleRelease'
    from layout.buildDirectory.dir('outputs/apk/release')
    include 'app-release.apk'
    into "${rootDir}/../master/apks"
    rename 'app-release.apk', 'tetz-agent.apk'
}
